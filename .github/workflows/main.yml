name: Release Creation

on: 
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event.release.target_commitish == 'main' }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Detect GitHub "Set as the latest release" checkbox state
      - name: Check if release is latest
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="${GITHUB_REPOSITORY%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          IS_LATEST=$(gh api graphql \
            -f query='query($owner:String!,$name:String!,$tag:String!) {
              repository(owner:$owner,name:$name) {
                release(tagName:$tag) { isLatest }
              }
            }' \
            -F owner="$OWNER" \
            -F name="$REPO" \
            -F tag="${{ github.event.release.tag_name }}" \
            --jq '.data.repository.release.isLatest')
          echo "is_latest=${IS_LATEST}" >> "$GITHUB_OUTPUT"
          if [ "$IS_LATEST" = "true" ]; then
            echo "manifest_url=https://github.com/${{ github.repository }}/releases/latest/download/module.json" >> "$GITHUB_OUTPUT"
          else
            echo "manifest_url=https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/module.json" >> "$GITHUB_OUTPUT"
          fi

      # Setup Node.js for pack compilation
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      # Install dependencies for pack compilation
      - name: Install dependencies
        run: npm ci

      # Compile packs using the fade-white-box-fmag scripts
      - name: Compile packs
        run: npm run comppacks

      # Substitute the Manifest and Download URLs in the module.json
      - name: Substitute Manifest and Download Links For Versioned Ones
        id: sub_manifest_link_version
        uses: microsoft/variable-substitution@v1
        with:
          files: 'module.json'
        env:
          version: ${{github.event.release.tag_name}}
          manifest: ${{ steps.latest.outputs.manifest_url }}
          download: https://github.com/${{github.repository}}/releases/download/${{github.event.release.tag_name}}/module.zip

      # Prepare release notes with auto-generated What's Changed + install URL
      - name: Prepare release notes
        id: prepare_notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BODY: ${{ github.event.release.body }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          TARGET_COMMITISH: ${{ github.event.release.target_commitish }}
          MANIFEST_URL: ${{ steps.latest.outputs.manifest_url }}
        run: |
          set -euo pipefail

          : > release_notes.txt

          if [ -n "${RELEASE_BODY}" ]; then
            printf '%s\n\n' "${RELEASE_BODY}" >> release_notes.txt
          fi

          # Prefer previous versioned release; exclude this tag and the synthetic "latest" tag
          PREVIOUS_TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
            --jq "[.[] | select(.draft == false and .tag_name != \"${TAG_NAME}\" and .tag_name != \"latest\")] | if length > 0 then .[0].tag_name else \"\" end")

          GEN_ARGS=(
            --method POST
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes"
            -f "tag_name=${TAG_NAME}"
            -f "target_commitish=${TARGET_COMMITISH}"
          )
          if [ -n "${PREVIOUS_TAG}" ]; then
            GEN_ARGS+=(-f "previous_tag_name=${PREVIOUS_TAG}")
          fi

          gh api "${GEN_ARGS[@]}" --jq .body >> release_notes.txt

          printf '\nTo install manually, use this URL:\n%s\n' "${MANIFEST_URL}" >> release_notes.txt

      # Create a zip file with all files required by the module to add to the release
      - name: Create module zip
        run: zip -r ./module.zip ./* -x '.git*' -x '.github/*' -x 'scripts/build/*' -x 'scripts/ps/*' -x 'packsrc/*' -x '.gitignore' -x 'package.json' -x 'package-lock.json' -x '.vscode/*' -x 'node_modules/*'

      # Create a release for this specific version
      - name: Update Release with Files
        id: create_version_release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true # Set this to false if you want to prevent updating existing releases
          name: ${{ github.event.release.name }}
          draft: false
          prerelease: false
          makeLatest: ${{ steps.latest.outputs.is_latest }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: './module.json, ./module.zip'
          tag: ${{ github.event.release.tag_name }}
          bodyfile: release_notes.txt

      # Update the 'latest' release only when this release is marked latest
      - name: Create Release
        id: create_latest_release
        if: ${{ steps.latest.outputs.is_latest == 'true' }}
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          name: Latest
          draft: false
          prerelease: false
          makeLatest: false
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: './module.json,./module.zip'
          tag: latest
          bodyfile: release_notes.txt

      # Publish to Foundry website
      - name: Publish Module to FoundryVTT Website
        if: ${{ !github.event.release.prerelease }}
        uses: cs96and/FoundryVTT-release-package@v1
        with:
          package-token: ${{ secrets.FOUNDRY_PACKAGE_TOKEN }}
          manifest-url: https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/module.json
